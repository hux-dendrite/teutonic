[project]
name = "teutonic"
version = "0.1.0"
description = "Bittensor SN3 Teutonic control plane and model evaluator."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
miner = [
    "bittensor>=10.3,<11",
    "boto3",
    "httpx",
    "PyNaCl>=1.5,<2",
]
validator = [
    "bittensor>=10.3,<11",
    "boto3",
    "httpx",
    "huggingface-hub>=0.34,<2",
    "numpy",
    "psycopg[binary]>=3.2,<3.3",
    "PyNaCl>=1.5,<2",
    "jsonschema>=4.22,<5",
]
evaluator = [
    "accelerate",
    "boto3",
    "fastapi",
    "gigatoken>=0.10,<0.11",
    "httpx",
    "numpy",
    "pyarrow",
    "pydantic",
    "safetensors",
    "torch",
    "transformers>=5.12.1,<6",
    "uvicorn",
]
dev = ["pytest", "ruff"]

[project.scripts]
teutonic-miner = "miner.cli:main"

[project.urls]
Homepage = "https://teutonic.ai"
Repository = "https://github.com/unarbos/teutonic"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["teutonic", "miner"]
only-include = [
    "chain_config.py",
    "chain.toml",
    "miner",
    "teutonic",
]

[tool.ruff]
line-length = 100
target-version = "py311"
