[project]
name = "teutonic"
version = "0.1.0"
description = "Bittensor SN3 Teutonic control plane and model evaluator."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "bittensor>=10.3,<11",
    "boto3",
    "httpx",
    "numpy",
    "safetensors",
    "torch",
    "transformers>=5.12.1,<6",
    "gigatoken>=0.10,<0.11",
    "fastapi",
    "uvicorn",
    "pydantic",
    "pyarrow",
    "accelerate",
    "psycopg[binary]>=3.2,<3.3",
    "PyNaCl>=1.5,<2",
    "jsonschema>=4.22,<5",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.urls]
Homepage = "https://teutonic.ai"
Repository = "https://github.com/unarbos/teutonic"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["archs", "teutonic"]
only-include = [
    "chain_config.py",
    "chain.toml",
    "archs",
    "teutonic",
]

[tool.ruff]
line-length = 100
target-version = "py311"
