name: teutonic

services:
  postgres:
    image: postgres:16.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-teutonic}
      POSTGRES_USER: ${POSTGRES_USER:-teutonic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-teutonic} -d ${POSTGRES_DB:-teutonic}"]
      interval: 5s
      timeout: 3s
      retries: 30
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./teutonic/schemas/control_plane.sql:/docker-entrypoint-initdb.d/001-control-plane.sql:ro

volumes:
  postgres-data:
