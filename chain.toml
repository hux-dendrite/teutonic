# Teutonic MiMo V2.5 Pro — 104B/64-expert top-4 custom Transformers model.
#
# MiMo snapshots are self-contained and ship configuration_mimo_v2.py plus
# modeling_mimo_v2.py. The validator permits only those exact files and
# requires a challenger's copies to hash-match the current king.
[chain]
name = "mimo-v2.5-pro"
seed_repo = "dendriteholdings/mimo-v2.5-pro-104b-64e-w1024-top4"
repo_pattern = "^[^/]+/mimo-v2\\.5-pro-.+$"

[arch]
module = "teutonic.archs.mimo"
extra_lock_keys = [
  "add_full_attention_sink_bias",
  "add_swa_attention_sink_bias",
  "attention_chunk_size",
  "attention_projection_layout",
  "attention_value_scale",
  "hybrid_block_size",
  "hybrid_layer_pattern",
  "layer_types",
  "layernorm_epsilon",
  "moe_intermediate_size",
  "moe_layer_freq",
  "n_group",
  "n_routed_experts",
  "n_shared_experts",
  "norm_topk_prob",
  "num_experts_per_tok",
  "partial_rotary_factor",
  "rope_parameters",
  "routed_scaling_factor",
  "scoring_func",
  "sliding_window",
  "sliding_window_size",
  "swa_head_dim",
  "swa_num_attention_heads",
  "swa_num_key_value_heads",
  "swa_rope_theta",
  "swa_v_head_dim",
  "topk_group",
  "topk_method",
  "v_head_dim",
]

[seed]
tokenizer_repo = "dendriteholdings/mimo-v2.5-pro-104b-64e-w1024-top4"
repo_backend = "hf"
seed_digest = "hf:56fc5b83784cb00a32c3f59e5ef92b9b58a7d7a9"
genesis_hotkey = "5E6yHkmZmSpBT5aa2rNZcmeYa1y3N9jw1h7g53oNPzMUpnqG"
