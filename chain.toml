# Teutonic II — 110B/256-expert top-8 custom Transformers model.
#
# MiMo snapshots are self-contained and ship configuration_mimo_v2.py plus
# modeling_mimo_v2.py. The validator permits only those exact files and
# requires a challenger's copies to hash-match the current king.
[chain]
name = "teutonic-II-110B"
seed_repo = "dendriteholdings/teutonic-II-110B-genesis"
repo_pattern = "^[^/]+/teutonic-II-110B-.+$"

[arch]
module = "teutonic.archs.mimo"
extra_lock_keys = [
  "add_full_attention_sink_bias",
  "add_swa_attention_sink_bias",
  "attention_chunk_size",
  "attention_projection_layout",
  "attention_value_scale",
  "hybrid_block_size",
  "hybrid_layer_pattern",
  "layer_types",
  "layernorm_epsilon",
  "moe_intermediate_size",
  "moe_layer_freq",
  "n_group",
  "n_routed_experts",
  "n_shared_experts",
  "norm_topk_prob",
  "num_experts_per_tok",
  "partial_rotary_factor",
  "rope_parameters",
  "routed_scaling_factor",
  "scoring_func",
  "sliding_window",
  "sliding_window_size",
  "swa_head_dim",
  "swa_num_attention_heads",
  "swa_num_key_value_heads",
  "swa_rope_theta",
  "swa_v_head_dim",
  "topk_group",
  "topk_method",
  "v_head_dim",
]

[seed]
tokenizer_repo = "dendriteholdings/teutonic-II-110B-genesis"
repo_backend = "hf"
seed_digest = "hf:dbacb5e544b03345ca7b8cc322e74ac08bb0cc36"
genesis_hotkey = "5E6yHkmZmSpBT5aa2rNZcmeYa1y3N9jw1h7g53oNPzMUpnqG"
